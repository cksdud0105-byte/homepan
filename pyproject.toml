[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homepan-skills"
version = "0.1.0"
description = "Evidence-based Korean blog production skills and local pipeline gates"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
homepan = "homepan.cli:main"

[tool.setuptools.packages.find]
include = ["homepan*"]
